name: Build Sunsheet Web Font

# Triggered by version tags (e.g. v0.1.0)
# To release: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v2.0.0)"
        required: false
        default: "v0.0.0-test"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Iosevka source
        uses: actions/checkout@v4
        with:
          repository: be5invis/Iosevka
          # Pinned: v34.4.0 was current when v2.0.0 built cleanly on 2026-04-26.
          # Unpinned this tracked upstream main, so every release built against
          # whatever had landed that day.
          ref: v34.4.0
          path: iosevka-src
          fetch-depth: 1

      - name: Install font build dependency
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break
            [ "$i" -eq 3 ] && exit 1
            sleep 5
          done
          for i in 1 2 3; do
            sudo apt-get install -y ttfautohint && break
            [ "$i" -eq 3 ] && exit 1
            sleep 5
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build full-coverage Sunsheet WOFF2 family
        run: |
          cp private-build-plans.toml iosevka-src/
          cd iosevka-src
          npm ci
          npm run build -- woff2::Sunsheet

      - name: Verify full web output
        run: |
          if [ ! -d "iosevka-src/dist/Sunsheet/WOFF2" ]; then
            echo "Sunsheet WOFF2 build output not found!"
            exit 1
          fi

          count=$(find iosevka-src/dist/Sunsheet/WOFF2 -name '*.woff2' | wc -l)
          if [ "$count" -ne 40 ]; then
            echo "Expected 40 WOFF2 faces, found $count"
            exit 1
          fi

      - name: Validate family names, Cyrillic, and fixed advances
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont

          required = [0x0041, 0x0401, 0x0410, 0x044F, 0x0451, 0x2192, 0x2500]
          fonts = sorted(Path("iosevka-src/dist/Sunsheet/WOFF2").glob("*.woff2"))
          assert len(fonts) == 40, len(fonts)
          for path in fonts:
              font = TTFont(path)
              cmap = font.getBestCmap() or {}
              missing = [f"U+{cp:04X}" for cp in required if cp not in cmap]
              assert not missing, f"{path.name}: missing {missing}"
              names = {
                  record.toUnicode()
                  for record in font["name"].names
                  if record.nameID in {1, 4, 6, 16}
              }
              assert any(name == "Sunsheet" or name.startswith("Sunsheet ") for name in names), (path, names)
              advances = {font["hmtx"].metrics[cmap[cp]][0] for cp in required}
              assert len(advances) == 1, (path, advances)
          print(f"validated {len(fonts)} Sunsheet WOFF2 faces")
          PY

      - name: Package full web archive
        run: |
          mkdir -p package/WOFF2
          cp iosevka-src/dist/Sunsheet/WOFF2/*.woff2 package/WOFF2/
          python3 - <<'PY'
          from pathlib import Path

          source = Path("site/css/main.css").read_text()
          faces = source.split("/* SUNSHEET_FONT_FACE_START */", 1)[1]
          faces = faces.split("/* SUNSHEET_FONT_FACE_END */", 1)[0]
          faces = faces.replace('../fonts/', './WOFF2/')
          Path("package/sunsheet.css").write_text(faces.strip() + "\n")
          PY
          cp README.md LICENSE package/
          cd package
          zip -r ../Sunsheet-Web-Full.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunsheet-Web-Full
          path: Sunsheet-Web-Full.zip

      - name: Set release version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Sunsheet ${{ steps.vars.outputs.tag }}"
          draft: true
          body: |
            Full-coverage WOFF2 web family with Latin, Greek, Cyrillic,
            arrows, mathematics, box drawing, and the remaining Iosevka
            glyph repertoire retained.
          files: Sunsheet-Web-Full.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}